}
function generateCode(type='Tài liệu',dept='Hành chính'){const prefix={Quytrinh:'QT'};const p={'Quy trình':'QT','Chính sách':'CS','Hợp đồng':'HD','Kế hoạch':'KH','Biên bản':'BB','Biểu mẫu':'BM','Hồ sơ':'HS'}[type]||'TL';const dp={'Hành chính':'HC','Công nghệ':'IT','Kinh doanh':'KD','Nhân sự':'NS','Tài chính':'TC'}[dept]||'PB';let n=DB.docs.length+1;while(DB.docs.some(d=>d.code===`${p}-${dp}-${String(n).padStart(3,'0')}`))n++;return `${p}-${dp}-${String(n).padStart(3,'0')}`;}
function newId(prefix='d'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function nextVersion(v){const [a,b]=String(v).split('.').map(n=>parseInt(n,10)||0);return `${a}.${(b||0)+1}`;}
function appendVersion(d,note,body=d.body){if(d.history[0]&&!d.history[0].body)d.history[0].body=d.body;const old=d.version;if(d.status==='Published')d.publishedVersion=d.version;d.version=nextVersion(d.version);d.body=body;d.status='Draft';d.date=TODAY;d.owner='Nguyễn Minh';d.initials='NM';d.history.unshift({v:d.version,date:'01/10/2026 · Demo',author:'Nguyễn Minh',note,body});logEvent('Sửa tài liệu',d,note,'v'+old,'v'+d.version);save();}
function saveEditor(id,submit=false){const d=docById(id);if(!d)return;if(UI.role==='Người xem'||['Review','Expired','Obsolete','Archived','Destroyed','DestructionPending'].includes(d.status)){toast('Tài liệu đang ở chế độ chỉ đọc theo luồng demo.',true);return;}const el=$('#editor-content');const text=el?.innerText.trim();if(!text){toast('Vui lòng nhập nội dung tài liệu.',true);el?.focus();return;}appendVersion(d,$('#editor-note')?.value||'Cập nhật nội dung bản nháp.',text);render();toast('Đã lưu bản nháp v'+d.version+' trong dữ liệu demo.');if(submit)openApproval(id);}
function sampleFiles(){UI.import.files=[{name:'Hướng dẫn lưu trữ hồ sơ.pdf',size:2.1,ext:'pdf',ocr:true},{name:'Danh mục tài liệu quý IV.xlsx',size:1.4,ext:'xlsx',ocr:false},{name:'Quy trình quản lý tài liệu nội bộ.docx',size:2.4,ext:'docx',duplicate:'d01',decision:'skip',ocr:false}];render();toast('Đã đưa 3 tệp mẫu vào hàng đợi, gồm 1 ví dụ trùng.');}
function acceptFiles(files){const max=30;const incoming=Array.from(files).slice(0,max).map(f=>({name:f.name,size:Math.max(.1,Math.round(f.size/1024/1024*10)/10),ext:f.name.split('.').pop().toLowerCase(),ocr:UI.import.source==='scan'}));UI.import.files.push(...incoming);render();toast(`Đã nhận thông tin ${incoming.length} tệp. Không đọc hoặc gửi nội dung tệp.`);}
function importCommit(){const im=UI.import;let added=[];im.files.forEach(f=>{if(f.duplicate){if(f.decision==='version'){const d=docById(f.duplicate);if(d){appendVersion(d,'Nhập phiên bản thay thế từ lô tài liệu mẫu.');added.push(d);}}return;}const name=f.name.replace(/\.[^.]+$/,'');const d={id:newId(),name,code:generateCode(im.meta.type,im.meta.dept),ext:f.ext||'pdf',type:im.meta.type,dept:im.meta.dept,folder:im.meta.folder,owner:'Nguyễn Minh',initials:'NM',version:'1.0',status:'Draft',date:TODAY,size:f.size,tags:im.meta.tags.split(',').map(t=>t.trim()).filter(Boolean),star:false,ocr:im.ocr&&['pdf','jpg','png','jpeg'].includes(f.ext),expires:'2027-10-01',retention:5,read:0,totalReaders:8,accessScope:im.access,permissionMatrix:im.permissions||null,body:'Tài liệu được tiếp nhận trong bản demo Folio DMS.\n\nTên tệp: '+f.name+'\nPhòng ban: '+im.meta.dept+'\nLoại tài liệu: '+im.meta.type+'\n\nĐây là nội dung minh họa, không phải nội dung trích xuất từ tệp đã chọn.',history:[{v:'1.0',date:'01/10/2026 · Demo',author:'Nguyễn Minh',note:'Tiếp nhận tài liệu mới.'}]};DB.docs.unshift(d);added.push(d);if(im.meta.record){const r=DB.records.find(r=>r.id===im.meta.record);if(r&&!r.closed)r.docs.push(d.id);}logEvent('Tiếp nhận',d,'Nhập từ nguồn '+im.source+' (mô phỏng).','—','Bản nháp');});save();UI.import={step:1,source:'upload',files:[],meta:{dept:'Hành chính',type:'Quy trình',tags:'Nội bộ',folder:'Hành chính'},access:'department',ocr:true};if(added.length){go('document/'+added[0].id+'/overview');toast('Đã tiếp nhận '+added.length+' tài liệu mẫu. Bạn có thể rà soát và trình duyệt.');}else{go('repository');toast('Không thêm tài liệu: tất cả bản trùng đã được bỏ qua.');}}
function downloadText(filename,text,mime='text/plain;charset=utf-8'){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csvValue(value){let str=String(value??'');if(/^[=+@-]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';}
function exportCSV(filename,headers,rows){downloadText(filename,'\ufeff'+[headers,...rows].map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Đã xuất CSV từ dữ liệu mẫu hiện tại.');}
function readPermissionMatrix(root=document){const result={};$$('[data-permission-row]',root).forEach(el=>{const r=el.dataset.permissionRow;result[r]??={};result[r][el.dataset.permissionAction]=el.checked;});return result;}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Đã sao chép liên kết mẫu (không truy cập thật).');}catch(_){const el=$('#generated-link');if(el){el.focus();el.select();toast('Chọn Ctrl+C để sao chép liên kết mẫu.');}else{openModal('Sao chép liên kết mẫu','Miền .example không phải địa chỉ truy cập thật.',input('generated-link',text,'readonly'),B('Đóng','modal-close'));$('#generated-link')?.select();}}}

/* Main event routing. No external resources or service calls are used. */
document.addEventListener('click',event=>{const target=event.target;if(!(target instanceof Element))return;const action=target.closest('[data-action]');if(action){event.preventDefault();if(action.disabled)return;try{handleAction(action.dataset.action,action);}catch(error){console.error(error);toast('Có lỗi ở thao tác demo. Hãy đặt lại dữ liệu hoặc tải lại trang.',true);}return;}const route=target.closest('[data-route]');if(route){event.preventDefault();if(route.disabled)return;const to=route.dataset.route;if(to.startsWith('document/')){const d=docById(to.split('/')[1]);if(d&&UI.lastDoc!==d.id){logEvent('Xem tài liệu',d,'Mở bản xem trước HTML trong demo.');UI.lastDoc=d.id;}}go(to);return;}if(target.matches('[data-overlay]')){closeModal();return;}const row=target.closest('[data-doc]');if(row&&!target.closest('input,select,label,button,a'))go('document/'+row.dataset.doc+'/overview');if(target.closest('#dropzone')&&!target.closest('button,input'))$('#file-input')?.click();});
document.addEventListener('mousedown',event=>{if(event.target instanceof Element&&event.target.closest('[data-action="format"]'))event.preventDefault();});
document.addEventListener('submit',event=>{if(!(event.target instanceof HTMLFormElement))return;event.preventDefault();try{handleSubmit(event.target);}catch(error){console.error(error);toast('Không thể lưu bước demo này. Vui lòng kiểm tra dữ liệu nhập.',true);}});
document.addEventListener('input',event=>{const e=event.target;if(!(e instanceof Element))return;if(e.dataset.input){UI[e.dataset.input]=e.value;render(true);}if(e.dataset.importMeta)UI.import.meta[e.dataset.importMeta]=e.value;});
document.addEventListener('change',event=>{const e=event.target;if(!(e instanceof Element))return;if(e.id==='file-input'){acceptFiles(e.files);return;}if(e.dataset.importMeta){UI.import.meta[e.dataset.importMeta]=e.value;return;}const type=e.dataset.change;if(!type)return;const id=e.dataset.id;
switch(type){
case 'select-all':UI.selected=e.checked?repoFiltered().map(d=>d.id):[];render();break;
case 'select-doc':UI.selected=e.checked?[...new Set([...UI.selected,id])]:UI.selected.filter(x=>x!==id);render();break;
case 'watch-doc':{const d=docById(id);d.watching=e.checked;save();toast(e.checked?'Đã theo dõi cập nhật tài liệu mẫu.':'Đã ngừng theo dõi tài liệu.');break;}
case 'inherit':{const d=docById(id);d.ownPermissions=!e.checked;save();toast(e.checked?'Bật kế thừa quyền thư mục (mô phỏng).':'Bật cấu hình quyền riêng (mô phỏng).');break;}
case 'duplicate-decision':UI.import.files[Number(e.dataset.index)].decision=e.value;break;
case 'intake-ocr':UI.import.ocr=e.checked;break;
case 'editor-font':$('#editor-content').style.fontFamily=e.value;break;
default:UI[type]=e.type==='checkbox'?e.checked:e.value;UI.selected=[];render(true);
}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();handleAction('quick-search',{dataset:{}});}if(event.key==='Escape'){closeModal();if(UI.mobile){UI.mobile=false;render();}}if(event.key==='Tab'&&$('.modal')){const focusable=$$('button:not([disabled]),[href],input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]',$('.modal')).filter(e=>e.offsetParent!==null);const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if((event.key==='Enter'||event.key===' ')&&event.target?.id==='dropzone'){event.preventDefault();$('#file-input')?.click();}});
document.addEventListener('dragover',event=>{if(Array.from(event.dataTransfer?.types||[]).includes('Files'))event.preventDefault();const zone=event.target instanceof Element?event.target.closest('#dropzone'):null;if(zone)zone.classList.add('dragging');});
document.addEventListener('dragleave',event=>{const zone=event.target instanceof Element?event.target.closest('#dropzone'):null;if(zone&&!zone.contains(event.relatedTarget))zone.classList.remove('dragging');});
document.addEventListener('drop',event=>{if(Array.from(event.dataTransfer?.types||[]).includes('Files'))event.preventDefault();const zone=event.target instanceof Element?event.target.closest('#dropzone'):null;if(zone){zone.classList.remove('dragging');acceptFiles(event.dataTransfer.files);}});
