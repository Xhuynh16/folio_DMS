function documentTable(list,{selectable=false,compact=false}={}){if(!list.length)return empty('Chưa có tài liệu phù hợp','Thử thay đổi bộ lọc hoặc tiếp nhận tài liệu mới.',R('Tiếp nhận tài liệu','intake','plus','primary'),'files');return `<div class="table-wrap"><table><thead><tr>${selectable?`<th style="width:36px;padding-right:0"><input type="checkbox" aria-label="Chọn tất cả tài liệu" data-change="select-all" ${list.every(d=>UI.selected.includes(d.id))?'checked':''}></th>`:''}<th>Tên tài liệu</th>${!compact?'<th>Phiên bản</th>':''}<th>Trạng thái</th>${!compact?'<th>Phòng ban</th>':''}<th>Cập nhật</th><th aria-label="Thao tác" style="width:42px"></th></tr></thead><tbody>${list.map(d=>`<tr class="row-link" data-doc="${E(d.id)}">${selectable?`<td style="padding-right:0"><input type="checkbox" aria-label="Chọn ${E(d.name)}" data-change="select-doc" data-id="${E(d.id)}" ${UI.selected.includes(d.id)?'checked':''}></td>`:''}<td><div class="flex gap16">${fileIcon(d.ext)}<div><button class="doc-name" data-route="document/${E(d.id)}/overview">${E(d.name)}</button><span class="doc-sub">${E(d.code)} <span style="margin:0 4px">·</span> ${d.size.toLocaleString('vi-VN')} MB ${d.locked?`<span title="Đang được chỉnh sửa">${I('lock','sm')}</span>`:''}</span></div></div></td>${!compact?`<td><span class="tag mono">v${E(d.version)}</span></td>`:''}<td>${statusBadge(d.status)}</td>${!compact?`<td>${E(d.dept)}</td>`:''}<td><div>${dateFmt(d.date)}</div><small class="soft" style="font-size:9px">${E(d.owner)}</small></td><td>${IB('more','Thao tác tài liệu','doc-menu',`data-id="${E(d.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`;}
function renderDashboard(){const live=DB.docs.filter(d=>d.status!=='Destroyed'),reviews=live.filter(d=>d.status==='Review'),published=live.filter(d=>d.status==='Published'),ready=live.filter(d=>d.status==='Approved');const groupCounts=[live.filter(d=>['Quy trình','Chính sách'].includes(d.type)).length,live.filter(d=>['Hợp đồng','Hồ sơ'].includes(d.type)).length,live.filter(d=>d.type==='Biểu mẫu').length,live.filter(d=>!['Quy trình','Chính sách','Hợp đồng','Hồ sơ','Biểu mẫu'].includes(d.type)).length];let running=0;const donutStops=groupCounts.map((n,i)=>{const from=running;running+=n/Math.max(1,live.length)*100;return ['#689b82','#9cbaa7','#c2d4c7','#e6ede8'][i]+' '+from+'% '+running+'%';}).join(',');const recent=[...live].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return pageHead('Mọi tài liệu. Một không gian.','Chào Minh, đây là tình hình tài liệu của bạn hôm nay.',B('Hướng dẫn demo','start-flow','play','',`data-id="create"`)+R('Tải tài liệu','intake','plus','primary'),'THỨ NĂM, 01 THÁNG 10, 2026')+`<div class="grid4 mb24">${metric('Tổng tài liệu',live.length,'<span class="green">↗ 3 mới</span> trong tuần này','files','repository','green')}${metric('Đang chờ phê duyệt',reviews.length,'<span class="amber">Cần xử lý</span> trước 02/10','clock','approvals','amber')}${metric('Tài liệu đã phát hành',published.length,'<span class="green">Có hiệu lực</span> trong không gian','checkCircle','publishing/active','green')}${metric('Sẵn sàng phát hành',ready.length,'<span style="color:#9b89b5">Đã phê duyệt</span> và chờ công bố','send','publishing','purple')}</div><div class="grid-main"><div class="stack24"><section class="card"><div class="card-head"><div><h2>Tài liệu làm việc gần đây</h2><p>Tiếp tục từ nơi bạn đã dừng lại.</p></div>${R('Xem tất cả','repository','arrow','link')}</div>${documentTable(recent,{compact:true})}<div class="card-foot"><span>${live.length} tài liệu trong không gian làm việc</span><span class="flex gap6">${I('shield','sm')} Chia sẻ có kiểm soát</span></div></section><div class="grid2"><section class="card padded"><div class="between"><div><h3>Hoạt động tài liệu</h3><p class="small muted mt8">7 ngày gần nhất · Dữ liệu minh họa</p></div>${badge('Tuần này')}</div><div class="mt16"><svg class="chart-svg" viewBox="0 0 400 145" role="img" aria-label="Biểu đồ minh họa hoạt động 7 ngày, xu hướng tăng"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7ca78b" stop-opacity=".18"/><stop offset="100%" stop-color="#7ca78b" stop-opacity="0"/></linearGradient></defs><path d="M0 20H400M0 60H400M0 100H400M0 140H400" stroke="#edf0f2" stroke-dasharray="4 5" fill="none"/><path d="M0 115C25 110 38 71 65 80S115 110 133 80 169 95 195 56 238 83 267 52 300 67 330 33 375 48 400 13L400 140H0Z" fill="url(#area)"/><path d="M0 115C25 110 38 71 65 80S115 110 133 80 169 95 195 56 238 83 267 52 300 67 330 33 375 48 400 13" fill="none" stroke="#7caa8d" stroke-width="2"/></svg><div class="chart-labels"><span>25/09</span><span>26/09</span><span>27/09</span><span>28/09</span><span>29/09</span><span>30/09</span><span>01/10</span></div></div></section><section class="card padded"><div class="between"><h3>Cơ cấu tài liệu</h3>${R('Chi tiết','reports','arrow','link')}</div><div class="flex gap16 mt24"><div class="donut" style="background:conic-gradient(${donutStops})"><div>${live.length}<small>tài liệu mẫu</small></div></div><div class="grow stack8">${[['Quy trình & chính sách','#689b82'],['Hợp đồng & hồ sơ','#9cbaa7'],['Biểu mẫu','#c2d4c7'],['Tài liệu khác','#e6ede8']].map(([l,c],i)=>`<div class="between small"><span class="muted"><span class="legend-dot" style="background:${c}"></span>${l}</span><span class="soft">${groupCounts[i]}</span></div>`).join('')}</div></div><p class="small soft mt16">Theo loại tài liệu trong kho mẫu hiện tại.</p></section></div></div><div class="stack24 dashboard-side"><section class="card"><div class="card-head"><h2>Cần bạn xử lý</h2>${badge(reviews.length+ready.length,'amber')}</div>${reviews.slice(0,2).map(d=>`<button class="task-item" data-action="review-doc" data-id="${d.id}"><span class="pill-icon amber">${I('checkCircle')}</span><span class="grow"><h4>${E(d.name)}</h4><p>Chờ duyệt · v${d.version}</p></span><span class="task-arrow">${I('chevron','sm')}</span></button>`).join('')}<button class="task-item" data-route="publishing"><span class="pill-icon blue">${I('send')}</span><span class="grow"><h4>Phát hành tài liệu đã duyệt</h4><p>${ready.length} tài liệu sẵn sàng công bố</p></span><span class="task-arrow">${I('chevron','sm')}</span></button><button class="task-item" data-route="lifecycle"><span class="pill-icon purple">${I('clock')}</span><span class="grow"><h4>Rà soát tài liệu sắp hết hạn</h4><p>Biểu mẫu thanh toán · 15/10</p></span><span class="task-arrow">${I('chevron','sm')}</span></button></section><section class="card padded"><div class="between mb16"><h3>Dòng hoạt động</h3>${I('history','sm')}</div><div class="timeline">${DB.audit.slice(0,3).map((a,i)=>`<div class="timeline-item"><span class="timeline-dot">${I(['eye','send','pencil'][i])}</span><div class="grow"><h4>${E(a.user)}</h4><p>${E(a.action)} · ${E(a.code)}</p><small class="soft" style="font-size:9px">${E(a.time)}</small></div></div>`).join('')}</div>${R('Mở nhật ký truy vết','audit','arrow','link')}</section></div></div><div class="banner mt24"><span class="banner-orb">${I('workflow')}</span><div class="grow"><h3>Một luồng liền mạch, từ tiếp nhận đến lưu giữ.</h3><p>Khám phá 5 kịch bản demo và đối chiếu giao diện của đầy đủ 20 nhóm nghiệp vụ DMS.</p></div>${R('Khám phá userflow','flows','arrow','')}</div>`;}
function repoFiltered(){return DB.docs.filter(d=>d.status!=='Destroyed'&&(UI.repoTab!=='favorites'||d.star)&&(UI.repoTab!=='mine'||d.owner==='Nguyễn Minh')&&(!UI.repoDept||(d.folder||d.dept)===UI.repoDept)&&(!UI.repoStatus||d.status===UI.repoStatus)&&(!UI.repoType||d.type===UI.repoType)&&(!UI.repoSearch||normalize(d.name+' '+d.code+' '+d.tags.join(' ')).includes(normalize(UI.repoSearch))));}
function renderRepository(){const list=repoFiltered();const used=DB.docs.reduce((n,d)=>n+(d.status==='Destroyed'?0:d.size),0);return pageHead('Kho tài liệu','Tổ chức, tìm kiếm và quản lý tài liệu từ một nơi duy nhất.',B('Thư mục mới','new-folder','folder')+R('Tải tài liệu','intake','upload','primary'))+`<div class="grid4 folders mb24">${['Hành chính','Công nghệ','Kinh doanh','Nhân sự'].map((dept,i)=>`<button class="card folder-card" data-action="repo-dept" data-value="${dept}"><div class="between"><span>${I('folder','folder-icon')}</span>${I('more','sm')}</div><h3>${dept}</h3><div class="between"><p>${DB.docs.filter(d=>d.dept===dept&&d.status!=='Destroyed').length} tài liệu</p><span class="small soft">Kho nội bộ</span></div></button>`).join('')}</div><div class="repo-layout"><aside class="tree"><div class="tree-label">THƯ MỤC LÀM VIỆC</div><button class="tree-item ${!UI.repoDept?'active':''}" data-action="repo-dept" data-value="">${I('layers')}Tất cả tài liệu</button>${DB.folders.map(f=>`<button class="tree-item sub ${UI.repoDept===f?'active':''}" data-action="repo-dept" data-value="${E(f)}">${I('folder')}${E(f)}</button>`).join('')}<div class="tree-label mt24">CHẾ ĐỘ XEM</div><button class="tree-item" data-action="repo-tab" data-value="favorites">${I('star')}Đã đánh dấu</button><button class="tree-item" data-route="lifecycle/archive">${I('archive')}Kho lưu trữ</button><button class="tree-item" data-action="duplicate-info">${I('copy')}Tệp trùng lặp</button><div class="storage-box"><div class="between"><span class="flex gap6">${I('database','sm')} Dung lượng</span><span>${Math.round(used/DB.quota*100)}%</span></div><div class="progress"><span style="width:${Math.min(100,used/DB.quota*100)}%"></span></div><span>${used.toFixed(1)} MB / ${DB.quota} MB</span><div class="mt8">${R('Quản lý lưu trữ','admin/storage','','link')}</div></div></aside><section><div class="between mb16 wrap"><div class="segmented">${[['all','Tất cả tài liệu'],['mine','Của tôi'],['favorites','Đã đánh dấu']].map(([v,l])=>`<button class="${UI.repoTab===v?'active':''}" data-action="repo-tab" data-value="${v}">${l}</button>`).join('')}</div><div class="segmented"><button class="${UI.repoView==='list'?'active':''}" aria-label="Hiển thị danh sách" data-action="repo-view" data-value="list">${I('list','sm')}</button><button class="${UI.repoView==='grid'?'active':''}" aria-label="Hiển thị lưới" data-action="repo-view" data-value="grid">${I('grid','sm')}</button></div></div><div class="filters"><div class="input-icon search-inline">${I('search','sm')}<input id="repo-search" placeholder="Tìm trong kho tài liệu..." value="${E(UI.repoSearch)}" data-input="repoSearch" aria-label="Tìm trong kho"></div>${select('repo-status',[['','Mọi trạng thái'],...Object.entries(STATUS).filter(([k])=>k!=='Destroyed').map(([k,v])=>[k,v[0]])],UI.repoStatus,'data-change="repoStatus" aria-label="Lọc trạng thái"')}${select('repo-type',[['','Loại tài liệu'],...TYPES],UI.repoType,'data-change="repoType" aria-label="Lọc loại tài liệu"')}${B('Bộ lọc','repo-filter','filter','sm')}${(UI.repoDept||UI.repoStatus||UI.repoType||UI.repoSearch)?B('Xóa lọc','clear-repo','','link'):''}</div>${UI.repoDept?`<div class="flex mb16"><span class="tag">${I('folder','sm')}${E(UI.repoDept)}</span>${B('Phân quyền thư mục','folder-permission','shield','link')}</div>`:''}${UI.selected.length?`<div class="bulkbar"><strong>Đã chọn ${UI.selected.length}</strong>${B('Lưu trữ','bulk-archive','archive','sm')}${B('Xuất danh sách','export-selected','download','sm')}${B('Bỏ chọn','clear-select','','link')}</div>`:''}${UI.repoView==='list'?`<div class="card">${documentTable(list,{selectable:true})}<div class="card-foot"><span>Hiển thị ${list.length} tài liệu mẫu ${UI.repoDept?'trong '+E(UI.repoDept):''}</span><span>Trang 1 / 1</span></div></div>`:`<div class="doc-grid">${list.map(d=>`<article class="card doc-tile"><div class="between">${fileIcon(d.ext,true)}${IB('star',d.star?'Bỏ đánh dấu':'Đánh dấu','star',`data-id="${d.id}" style="color:${d.star?'#c1a367':'#a5adb6'}"`)}</div><h3><button data-route="document/${d.id}/overview">${E(d.name)}</button></h3><div class="small soft mt8">${E(d.code)} · v${d.version}</div><div class="tile-foot">${statusBadge(d.status)}${avatar(d.initials,'teal')}</div></article>`).join('')}</div>`}</section></div>`;}
function paperPreview(d){return `<div class="paper"><div class="watermark">NỘI BỘ · DEMO</div><div class="paper-top"><span class="paper-brand">AN PHÁT</span><span>HỆ THỐNG QUẢN LÝ TÀI LIỆU</span></div><h2>${E(d.name)}</h2><div class="paper-code">Mã: ${E(d.code)} &nbsp; | &nbsp; Phiên bản: ${E(d.version)} &nbsp; | &nbsp; ${dateFmt(d.date)}</div>${d.body.split('\n\n').map((p,i)=>p.includes('\n')?`<h4>${E(p.split('\n')[0])}</h4><p>${E(p.split('\n').slice(1).join(' '))}</p>`:`<h4>${i+1}. ${i===0?'NỘI DUNG TÀI LIỆU':'THÔNG TIN BỔ SUNG'}</h4><p>${E(p)}</p>`).join('')}${d.body.length<500?`<h4>PHẠM VI VÀ QUẢN LÝ</h4><p>Tài liệu được phân loại theo ${E(d.type.toLowerCase())}, thuộc ${E(d.dept)}. Nội dung này là dữ liệu minh họa để xem bố cục và luồng xử lý của hệ thống.</p><h4>KIỂM SOÁT PHIÊN BẢN</h4><p>Mọi cập nhật cần được ghi nhận vào lịch sử. Chỉ sử dụng bản đã được phê duyệt và có hiệu lực.</p>`:''}<div class="paper-sign"><span>Người soạn thảo<br><b>${E(d.owner)}</b></span><span>Người phê duyệt<br><b>Ban phê duyệt</b></span></div><div class="paper-footer">Tài liệu mẫu • Chỉ dùng trình diễn giao diện • Không có giá trị nghiệp vụ thực</div></div>`;}
function customFieldInput(f,d){const val=d.custom?.[f.id]||'';const attrs=f.required?'required':'';if(f.type==='Boolean')return select('custom-'+f.id,[['','Chọn giá trị'],['true','Có'],['false','Không']],val,attrs);if(f.type==='Danh mục')return select('custom-'+f.id,[['','Chọn danh mục'],['Nội bộ','Nội bộ'],['Dự án','Dự án'],['Khách hàng','Khách hàng']],val,attrs);return input('custom-'+f.id,val,attrs+(f.type==='Số'?' type="number"':f.type==='Ngày tháng'?' type="date"':''));}
function renderDocument(id,tab){const d=docById(id);if(!d)return empty('Không tìm thấy tài liệu','Tài liệu có thể đã được đặt lại trong demo.',R('Về kho tài liệu','repository','arrowLeft','primary'));let acts=B(d.star?'Đã đánh dấu':'Đánh dấu','star','star','',`data-id="${id}"`)+B('Chia sẻ','share','link','',`data-id="${id}"`);if(['Draft','Approved','Published'].includes(d.status))acts+=R('Chỉnh sửa',`editor/${id}`,'pencil','');if(d.status==='Draft')acts+=B('Trình duyệt','request-approval','send','primary',`data-id="${id}"`);if(d.status==='Review')acts+=B('Xem phê duyệt','review-doc','checkCircle','primary',`data-id="${id}"`);if(d.status==='Approved')acts+=B('Phát hành','publish','send','primary',`data-id="${id}"`);const heads=`<div class="between mb16">${R('Kho tài liệu','repository','arrowLeft','link')}<span class="small soft">${E(d.dept)} / ${E(d.type)}</span></div><div class="document-head">${fileIcon(d.ext,true)}<div class="grow"><h1>${E(d.name)}</h1><div class="meta-inline"><span class="mono">${E(d.code)}</span><span>·</span><span>v${E(d.version)}</span><span>·</span>${statusBadge(d.status)}${d.locked?badge('Đang được Nguyễn Minh chỉnh sửa','amber'):''}</div></div></div><div class="between wrap mb24"><div class="flex small muted">${avatar(d.initials,'teal')} ${E(d.owner)} <span class="soft">· Cập nhật ${dateFmt(d.date)}</span></div><div class="flex wrap">${acts}</div></div>`;let body='';const right=`<div class="stack"><section class="card side-card"><div class="between"><h3>Thông tin tài liệu</h3>${R('Sửa',`document/${id}/metadata`,'pencil','link')}</div>${infoRow('Mã tài liệu',`<span class="mono">${E(d.code)}</span>`)}${infoRow('Loại tài liệu',E(d.type))}${infoRow('Phòng ban',E(d.dept))}${infoRow('Người sở hữu',E(d.owner))}${infoRow('Định dạng',d.ext.toUpperCase())}${infoRow('Dung lượng',d.size+' MB')}${infoRow('Hết hiệu lực',dateFmt(d.expires))}${infoRow('Lưu giữ',d.retention+' năm (mẫu)')}<div class="mt16"><span class="small muted">Nhãn tài liệu</span><div class="flex wrap mt8">${tags(d.tags)}</div></div></section><section class="card side-card"><h3>Kiểm soát truy cập</h3>${infoRow('Phạm vi','Nội bộ doanh nghiệp')}${infoRow('Quyền','Kế thừa từ thư mục')}${infoRow('Watermark',badge('Bật · Mô phỏng','green'))}<div class="mt16">${R('Xem quyền truy cập',`document/${id}/permissions`,'shield','link')}</div></section><section class="card side-card"><div class="between"><h3>Theo dõi tài liệu</h3><input class="switch" type="checkbox" role="switch" aria-label="Theo dõi cập nhật tài liệu" data-change="watch-doc" data-id="${id}" ${d.watching?'checked':''}></div><p class="small muted">Nhận thông báo khi có phiên bản mới hoặc thay đổi trạng thái.</p></section></div>`;
if(tab==='overview')body=`${d.status==='Published'?`<div class="notice mb16">${I('checkCircle')}<div class="grow"><strong>Bản chính thức đang có hiệu lực</strong><br>Phiên bản ${E(d.publishedVersion||d.version)} · Phân phối nội bộ · ${d.read}/${d.totalReaders} người đã đọc.</div>${B(d.acknowledged?'Đã xác nhận đọc':'Xác nhận đã đọc','acknowledge','check','sm',`data-id="${id}" ${d.acknowledged?'disabled':''}`)}</div>`:d.publishedVersion?notice(`Bản làm việc v${d.version}. Bản chính thức v${d.publishedVersion} vẫn được giữ trong lịch sử cho tới khi phiên bản mới được phát hành.`,'blue'):['Expired','Obsolete','Destroyed'].includes(d.status)?notice('Tài liệu không còn hiệu lực sử dụng. Vui lòng tìm phiên bản thay thế.','amber'):''}<div class="doc-layout"><section class="preview-shell"><div class="preview-toolbar"><span class="flex">${I('file','sm')} Bản xem trước minh họa</span><span class="grow"></span><span>1 / 1</span><span class="tag">100%</span>${IB('download','Tải nội dung mẫu','download-doc',`data-id="${id}"`)}${IB('print','In bản mẫu','print-doc',`data-id="${id}"`)}</div><div class="preview-body">${paperPreview(d)}</div></section>${right}</div>`;
else if(tab==='metadata')body=`<div class="doc-layout"><section class="card padded"><h2 class="mb8">Thuộc tính & phân loại</h2><p class="muted small mb24">Các thuộc tính giúp tìm kiếm và quản lý tài liệu không phụ thuộc tên thư mục.</p><form id="metadata-form" data-form="metadata" data-id="${id}"><div class="grid2">${F('Tên tài liệu <span class="required">*</span>',input('doc-name',d.name,'required maxlength="180"'))}${F('Mã tài liệu',input('doc-code',d.code,'readonly'), 'Mã định danh không thay đổi khi đổi tên tệp.')}${F('Loại tài liệu',select('doc-type',TYPES,d.type))}${F('Phòng ban',select('doc-dept',DEPTS,d.dept))}${F('Ngày hết hiệu lực',input('doc-expiry',d.expires,'type="date"'))}${F('Thời hạn lưu giữ (năm)',input('doc-retention',d.retention,'type="number" min="1" max="100"'))}${F('Nhãn (phân tách bằng dấu phẩy)',input('doc-tags',d.tags.join(', ')))}${F('Khách hàng / Dự án',input('doc-context',d.context||'Triển khai DMS 2026'))}${DB.fields.filter(f=>!['f1','f2','f3','f4','f5'].includes(f.id)).map(f=>F(E(f.name),customFieldInput(f,d))).join('')}</div><div class="divider"></div><div class="between">${R('Cấu hình schema','admin/metadata','settings','link')}<button class="btn primary" type="submit">${I('save','sm')}Lưu thuộc tính</button></div></form></section>${right}</div>`;
else if(tab==='versions')body=`<div class="doc-layout"><div class="stack"><div class="card padded"><div class="between wrap"><div><h2>Kiểm soát chỉnh sửa</h2><p class="muted small mt8">Check-out để thông báo tài liệu đang được chỉnh sửa.</p></div>${B(d.locked?'Check-in & mở khóa':'Check-out tài liệu','lock-doc',d.locked?'unlock':'lock',d.locked?'primary':'',`data-id="${id}"`)}</div>${d.locked?`<div class="mt16">${notice('Nguyễn Minh đang giữ khóa chỉnh sửa. Chọn Check-in để mở khóa sau khi lưu.','amber','lock')}</div>`:''}</div><section class="card"><div class="card-head"><div><h2>Lịch sử phiên bản</h2><p>Khôi phục tạo bản nháp mới, không ghi đè lịch sử.</p></div>${B('Tải phiên bản mới','new-version','upload','',`data-id="${id}"`)}</div>${d.history.map((h,i)=>`<div class="version-item"><span class="version-tag">v${E(h.v)}</span><div class="grow"><div class="flex"><h4>${E(h.note)}</h4>${i===0?badge('Hiện tại','green'):''}</div><p>${E(h.author)} · ${E(h.date)}</p></div>${i>0?B('Khôi phục','restore-version','history','sm',`data-id="${id}" data-version="${E(h.v)}"`):badge('Bản đang xem')}</div>`).join('')}</section></div>${right}</div>`;
else if(tab==='permissions')body=`<section class="card"><div class="card-head"><div><h2>Quyền truy cập tài liệu</h2><p>Phân quyền theo người dùng, nhóm hoặc phòng ban.</p></div>${B('Thêm đối tượng','add-access','plus','',`data-id="${id}"`)}</div><div style="padding:0 22px 18px">${notice('Ma trận chỉ minh họa cấu hình quyền. Demo chạy trong trình duyệt, không thực thi bảo mật tài liệu.','amber','shield')}${toggle('inherit','Kế thừa quyền từ thư mục '+E(d.dept),'Tắt để khai báo quyền riêng cho tài liệu này.',!d.ownPermissions,`data-change="inherit" data-id="${id}"`)}</div>${permissionsTable(d)}<div class="card-foot"><span>Phạm vi: tài liệu ${E(d.code)}</span>${B('Lưu quyền mẫu','save-permissions','save','primary',`data-id="${id}"`)}</div></section>`;
else if(tab==='workflow')body=`<div class="grid2"><section class="card padded"><div class="between mb24"><h2>Luồng phê duyệt</h2>${badge(d.workflowMode==='parallel'?'Song song':'Tuần tự','blue')}</div>${workflowVisual(d)}<div class="mt24 flex wrap">${B('Cấu hình luồng','request-approval','sliders','',`data-id="${id}"`)}${B('Mở hộp phê duyệt','review-doc','arrow','primary',`data-id="${id}"`)}</div></section><section class="card padded"><h2 class="mb16">Trạng thái xử lý</h2>${infoRow('Tài liệu',statusBadge(d.status))}${infoRow('Người trình','Nguyễn Minh')}${infoRow('Hạn phê duyệt',dateFmt(d.approvalDue||'2026-10-02'))}${infoRow('Cơ chế',d.workflowMode==='parallel'?'Cần tất cả người duyệt':'Duyệt theo từng cấp')}<div class="mt24">${notice('Việc duyệt trong demo chỉ cập nhật dữ liệu mẫu; không gửi email, không áp dụng chữ ký thật.')}</div>${d.reviewNote?`<div class="mt16"><h3>Ý kiến gần nhất</h3><p class="small muted mt8">${E(d.reviewNote)}</p></div>`:''}</section></div>`;
else if(tab==='distribution')body=`<div class="card padded"><div class="between mb24"><div><h2>Phân phối & xác nhận đọc</h2><p class="small muted mt8">Theo dõi việc sử dụng phiên bản chính thức.</p></div>${d.status==='Approved'?B('Phát hành tài liệu','publish','send','primary',`data-id="${id}"`):B('Danh sách người nhận','readers','users','',`data-id="${id}"`)}</div>${d.status==='Published'?`${readerTable(d)}<div class="mt24 flex wrap">${B(d.acknowledged?'Bạn đã xác nhận đọc':'Tôi đã đọc tài liệu','acknowledge','checkCircle','primary',`data-id="${id}" ${d.acknowledged?'disabled':''}`)}${B('Nhắc người chưa đọc','remind-readers','bell','',`data-id="${id}"`)}${B('Thu hồi / thay thế','recall','archive','',`data-id="${id}"`)}</div>`:notice('Tài liệu chưa được phát hành. Hoàn tất phê duyệt để thiết lập danh sách phân phối.','blue')}</div>`;
else body=`<section class="card"><div class="card-head"><div><h2>Lịch sử hoạt động</h2><p>Truy vết các thao tác trên tài liệu.</p></div>${R('Mở nhật ký','audit','external','link')}</div>${auditTable(DB.audit.filter(a=>a.code===d.code))}</section>`;
return heads+tabbar([['overview','Xem tài liệu'],['metadata','Thuộc tính'],['versions','Phiên bản',d.history.length],['permissions','Quyền truy cập'],['workflow','Phê duyệt'],['distribution','Phân phối'],['activity','Lịch sử']],tab,`document/${id}`)+body;}
function permissionsTable(d){const rows=d?.accessRows||['Nguyễn Minh (Chủ sở hữu)','Nhóm '+(d?.dept||'Hành chính'),'Ban phê duyệt','Toàn thể nhân viên'];let saved=d?.permissionMatrix;return `<div class="table-wrap"><table class="permission-table"><thead><tr><th>Đối tượng được cấp quyền</th>${['Xem','Sửa','Xóa','Tải','Chia sẻ','In'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td><div class="flex">${I(i===0?'user':'users','sm')}<span>${E(r)}</span></div></td>${['view','edit','delete','download','share','print'].map((a,j)=>`<td><input type="checkbox" aria-label="${E(r+' — '+['Xem','Sửa','Xóa','Tải','Chia sẻ','In'][j])}" name="permission-${i}-${a}" data-permission-row="${i}" data-permission-action="${a}" ${(saved?.[i]?.[a]??(i===0||(i===1&&j!==2)||(i===2&&[0,3,5].includes(j))||(i===3&&j===0)))?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function workflowVisual(d){const step=d.approvalStep||0;const finished=['Approved','Published','Archived','Expired'].includes(d.status);const people=d.approvers||['Trần Mai Anh','Nguyễn Minh'];const parallel=d.workflowMode==='parallel';const node=(p,i)=>`<div class="workflow-node ${!finished&&(parallel||i===step)&&i>=step?'active':''}"><span class="node-number">${finished||i<step?I('check','sm'):i+1}</span><div class="grow"><h3>${E(p)}</h3><p class="small soft">${parallel?'Nhánh '+(i+1):'Cấp '+(i+1)+' · '+(i===0?'Rà soát nội dung':'Duyệt ban hành')}</p></div>${badge(finished||i<step?'Đã duyệt':(parallel||i===step?'Chờ duyệt':'Chưa tới lượt'),finished||i<step?'green':(parallel||i===step?'amber':''))}</div>`;return `<div class="workflow-steps"><div class="workflow-node"><span class="node-number">${I('file','sm')}</span><div><h3>Trình duyệt tài liệu</h3><p class="small soft">${E(d.owner)} · v${E(d.version)}</p></div></div><div class="node-connector"></div>${parallel?`<div class="parallel-label">PHÊ DUYỆT ĐỒNG THỜI · CẦN TẤT CẢ</div><div class="parallel-nodes">${people.map(node).join('')}</div>`:people.map((p,i)=>node(p,i)+(i<people.length-1?'<div class="node-connector"></div>':'')).join('')}<div class="node-connector"></div><div class="workflow-node"><span class="node-number">${I('send','sm')}</span><div><h3>Sẵn sàng phát hành</h3><p class="small soft">Sau khi đủ tất cả phê duyệt</p></div></div></div>`;}
function renderEditor(id){const d=docById(id);if(!d)return empty('Không tìm thấy tài liệu','Hãy chọn lại tài liệu trong kho.',R('Mở kho','repository','','primary'));const blocked=['Review','Expired','Obsolete','Archived','Destroyed','DestructionPending'].includes(d.status)||UI.role==='Người xem';return pageHead('Soạn thảo tài liệu',`${E(d.code)} · Bản làm việc v${E(d.version)} · ${E(d.name)}`,R('Đóng trình soạn thảo',`document/${id}/overview`,'x')+B('Lưu bản nháp','save-editor','save','',`data-id="${id}" ${blocked?'disabled':''}`)+B('Lưu & trình duyệt','save-and-submit','send','primary',`data-id="${id}" ${blocked?'disabled':''}`))+`<div class="mb16">${notice(blocked?'Tài liệu đang bị khóa theo trạng thái hoặc vai trò xem. Hãy yêu cầu chỉnh sửa ở bước phê duyệt hoặc quay lại tài liệu bản nháp.':d.status==='Published'?'Bạn đang sửa bản làm việc mới. Bản chính thức hiện tại được giữ trong lịch sử cho tới lần phát hành tiếp theo.':'Trình soạn thảo mô phỏng: sửa văn bản và lưu thành phiên bản mới trong trình duyệt.',blocked?'amber':'blue',blocked?'lock':'pencil')}</div><div class="grid-main"><section><div class="editor-ribbon">${select('editor-font',['Segoe UI','Arial','Times New Roman'],'Segoe UI','aria-label="Kiểu chữ" data-change="editor-font"')}<button type="button" class="icon-button" data-action="format" data-command="bold" aria-label="In đậm"><b>B</b></button><button class="icon-button" data-action="format" data-command="italic" aria-label="In nghiêng"><i>I</i></button><button class="icon-button" data-action="format" data-command="underline" aria-label="Gạch chân"><u>U</u></button><span class="topbar-divider"></span>${IB('list','Danh sách','format','data-command="insertUnorderedList"')}${IB('arrowLeft','Hoàn tác','format','data-command="undo"')}<span class="grow"></span>${B('Mở bằng Office','office','office','sm',`data-id="${id}"`)}</div><div class="editor-area"><div class="paper"><div class="paper-top"><span class="paper-brand">AN PHÁT</span><span>BẢN LÀM VIỆC · DEMO</span></div><h2>${E(d.name)}</h2><div class="paper-code">${E(d.code)} · Phiên bản ${E(d.version)}</div><div id="editor-content" class="editable-content" contenteditable="${!blocked}" role="textbox" aria-multiline="true" aria-label="Nội dung tài liệu">${E(d.body)}</div></div></div><div class="editor-status"><span>${I('save','sm')} Nội dung chỉ lưu sau khi bấm “Lưu bản nháp”</span><span>Tiếng Việt · ${d.ext.toUpperCase()}</span></div></section><aside class="stack"><section class="card padded"><h3>Thông tin phiên bản mới</h3><div class="mt16 stack">${F('Ghi chú thay đổi',`<textarea id="editor-note" placeholder="Mô tả nội dung đã sửa...">Cập nhật nội dung tài liệu trong bản demo.</textarea>`)}${infoRow('Người sửa','Nguyễn Minh')}${infoRow('Ngày cập nhật','01/10/2026')}${infoRow('Trạng thái sau lưu',badge('Bản nháp'))}</div></section><section class="card padded"><h3>Check-in / Check-out</h3><p class="small muted mt8">Khóa chỉnh sửa hiển thị cho những người dùng khác trong mô hình DMS.</p><div class="mt16">${B(d.locked?'Check-in & mở khóa':'Check-out tài liệu','lock-doc',d.locked?'unlock':'lock','w100',`data-id="${id}"`)}</div></section><section class="card padded"><h3>Luồng tiếp theo</h3><div class="timeline mt16"><div class="timeline-item"><span class="timeline-dot">1</span><div><h4>Lưu bản nháp</h4><p>Tăng phiên bản, ghi nhận người sửa.</p></div></div><div class="timeline-item"><span class="timeline-dot future">2</span><div><h4>Trình duyệt</h4><p>Chọn quy trình, người duyệt và hạn xử lý.</p></div></div><div class="timeline-item"><span class="timeline-dot future">3</span><div><h4>Phát hành</h4><p>Đưa bản đã duyệt vào sử dụng.</p></div></div></div></section></aside></div>`;}
function renderIntake(){const im=UI.import;let content='';const sources=[['upload','upload','Tải từ máy tính','Kéo-thả hoặc nhập hàng loạt'],['scan','scan','Scan & OCR','Số hóa tài liệu giấy'],['email','mail','Nhập từ email','Hộp thư dùng chung'],['api','plug','ERP / CRM / API','Kết nối hệ thống nghiệp vụ']];if(im.step===1){content=`<h2 class="mb8">Tài liệu của bạn đến từ đâu?</h2><p class="small muted mb24">Chọn nguồn tiếp nhận để bắt đầu. Demo chỉ đọc tên và dung lượng tệp.</p><div class="grid4 mb24">${sources.map(([v,i,t,s])=>`<button class="source-card ${im.source===v?'selected':''}" data-action="intake-source" data-value="${v}"><div class="between">${I(i)}${im.source===v?I('checkCircle','sm'):''}</div><h4>${t}</h4><p>${s}</p></button>`).join('')}</div>${['upload','scan'].includes(im.source)?`<div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Chọn hoặc kéo thả tệp"><span class="upload-orb">${I(im.source==='scan'?'scan':'cloud','lg')}</span><h3>${im.source==='scan'?'Thêm bản scan để xem luồng OCR':'Kéo và thả tài liệu vào đây'}</h3><p>PDF, Word, Excel, PowerPoint, hình ảnh · Có thể chọn nhiều tệp</p><div class="flex wrap" style="justify-content:center">${B('Chọn tệp từ máy','choose-files','upload','primary')}${B('Dùng 3 tệp mẫu','sample-files','files','')}</div><input type="file" multiple id="file-input" class="sr-only" tabindex="-1" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.txt"></div>`:`<div class="card padded" style="background:#fafcfa"><div class="flex gap16"><span class="pill-icon blue">${I(im.source==='email'?'mail':'plug')}</span><div class="grow"><h3>${im.source==='email'?'Hộp thư văn thư':'Nguồn ERP / CRM mẫu'}</h3><p class="small muted mt8">${im.source==='email'?'vanthu@anphat.example · thư mục “Tài liệu đến”':'REST API · /api/v1/documents/import · định dạng JSON + tệp'}</p></div>${badge('Nguồn giả lập','blue')}</div><div class="divider"></div><div class="grid2">${F('Nguồn tiếp nhận',select('intake-connector',im.source==='email'?['Hộp thư văn thư','Outlook cá nhân']:['ERP — Hóa đơn & hợp đồng','CRM — Hồ sơ khách hàng']))}${F('Phạm vi nhập',select('intake-range',['Chưa nhập vào DMS','7 ngày gần nhất','Toàn bộ tài liệu mẫu']))}</div><div class="mt24 flex">${B('Lấy tài liệu mẫu','sample-files','refresh','primary')}${R('Cấu hình kết nối','integrations','settings','')}</div></div>`}<div class="mt16">${notice('Không upload, không scan và không gọi API thật. Tên tệp chỉ dùng để dựng trạng thái tiếp nhận trong bản mẫu.','gray')}</div>${im.files.length?`<div class="mt24"><div class="between mb12"><h3>${im.files.length} tệp trong hàng đợi</h3>${B('Xóa hàng đợi','clear-import','trash','link')}</div><div class="card">${im.files.map((f,i)=>`<div class="list-row" style="padding:13px 16px">${fileIcon(f.ext)}<div class="grow"><h3 style="font-size:11px">${E(f.name)}</h3><p class="small soft">${f.size.toFixed(1)} MB · ${im.source==='scan'?'Chờ OCR':'Sẵn sàng phân loại'}</p></div>${f.duplicate?badge('Có thể trùng','amber'):badge('Sẵn sàng','green')}${IB('x','Bỏ tệp khỏi hàng đợi','remove-import-file',`data-index="${i}"`)}</div>`).join('')}</div></div>`:''}`;}
else if(im.step===2){content=`<div class="between mb24"><div><h2>Phân loại & kiểm tra tài liệu</h2><p class="small muted mt8">Gán thuộc tính chung cho lô tài liệu; xử lý các tệp trùng trước khi lưu.</p></div>${B('Xem kết quả OCR','ocr','scan','')}</div><form id="intake-meta-form"><div class="grid2 mb24">${F('Loại tài liệu <span class="required">*</span>',select('import-type',TYPES,im.meta.type,'data-import-meta="type"'))}${F('Phòng ban <span class="required">*</span>',select('import-dept',DEPTS,im.meta.dept,'data-import-meta="dept"'))}${F('Nhãn tài liệu',input('import-tags',im.meta.tags,'data-import-meta="tags"'))}${F('Mẫu sinh mã',input('import-code','DMS-{PB}-{###}','readonly'),'Mã được cấp khi hoàn tất tiếp nhận.')}</div></form><div class="card"><div class="table-wrap"><table><thead><tr><th>Tệp tin</th><th>Kết quả nhận dạng</th><th>Xử lý</th></tr></thead><tbody>${im.files.map((f,i)=>`<tr><td><div class="flex">${fileIcon(f.ext)}<div><span class="doc-name">${E(f.name)}</span><small class="soft">${f.size.toFixed(1)} MB</small></div></div></td><td>${f.duplicate?badge('Trùng tệp mẫu · checksum','amber'):badge(im.ocr?'OCR mẫu sẵn sàng':'Tệp điện tử','green')}</td><td>${f.duplicate?select('duplicate-'+i,[['skip','Bỏ qua bản trùng'],['version','Lưu thành phiên bản mới']],f.decision||'skip',`data-change="duplicate-decision" data-index="${i}" style="font-size:10px"`):'<span class="small muted">Thêm tài liệu mới</span>'}</td></tr>`).join('')}</tbody></table></div></div><div class="mt16">${notice('Kết quả OCR và checksum là dữ liệu dựng sẵn. Demo chưa nhận dạng nội dung hoặc tính băm tệp thật.','amber','scan')}</div>${toggle('intake-ocr','Tạo bản PDF có thể tìm kiếm','Giữ bản gốc và tạo lớp văn bản OCR — thể hiện bằng trạng thái mẫu.',im.ocr,'data-change="intake-ocr"')}`;}
else if(im.step===3){content=`<h2 class="mb8">Chọn nơi lưu & quyền truy cập</h2><p class="small muted mb24">Tài liệu sẽ kế thừa quyền của thư mục, trừ khi thiết lập phạm vi riêng.</p><div class="grid2 mb24">${F('Thư mục lưu trữ',select('import-folder',DB.folders,im.meta.folder,'data-import-meta="folder"'))}${F('Gắn vào hồ sơ (tùy chọn)',select('import-record',[['','Chưa gắn hồ sơ'],...DB.records.filter(r=>!r.closed).map(r=>[r.id,r.name])],im.meta.record||'','data-import-meta="record"'))}</div><h3 class="mb16">Phạm vi truy cập</h3><div class="grid3 mb24">${[['department','users','Theo phòng ban','Kế thừa từ thư mục'],['private','lock','Chỉ mình tôi','Tài liệu nháp riêng tư'],['internal','globe','Toàn bộ nội bộ','Chỉ xem, không sửa']].map(([v,i,t,s])=>`<button class="source-card ${im.access===v?'selected':''}" data-action="intake-access" data-value="${v}">${I(i)}<h4>${t}</h4><p>${s}</p></button>`).join('')}</div>${notice('Mỗi tài liệu có thể cấu hình quyền xem, sửa, xóa, tải xuống, chia sẻ và in tại tab “Quyền truy cập”.','blue','shield')}<div class="mt24">${permissionsTable({dept:im.meta.dept,accessRows:im.access==='private'?['Nguyễn Minh (Chủ sở hữu)']:im.access==='internal'?['Nguyễn Minh (Chủ sở hữu)','Toàn thể nhân viên']:['Nguyễn Minh (Chủ sở hữu)','Nhóm '+im.meta.dept]})}</div>`;}
else{const newCount=im.files.filter(f=>!f.duplicate||f.decision==='version').length;content=`<div class="center mb24"><span class="pill-icon" style="margin:0 auto 15px;width:52px;height:52px">${I('checkCircle','lg')}</span><h2>Sẵn sàng đưa vào kho tài liệu</h2><p class="small muted mt8">Kiểm tra thông tin trước khi hoàn tất lô tiếp nhận.</p></div><div class="grid2 mb24"><div class="card padded">${infoRow('Nguồn',sources.find(s=>s[0]===im.source)?.[2]||'Tải tệp')}${infoRow('Tổng tệp đã chọn',im.files.length)}${infoRow('Tạo mới / cập nhật',newCount)}${infoRow('Bỏ qua bản trùng',im.files.length-newCount)}</div><div class="card padded">${infoRow('Phòng ban',E(im.meta.dept))}${infoRow('Loại tài liệu',E(im.meta.type))}${infoRow('Thư mục',E(im.meta.folder))}${infoRow('Phạm vi',im.access==='private'?'Chỉ mình tôi':im.access==='internal'?'Toàn bộ nội bộ':'Theo phòng ban')}</div></div>${notice('Sau tiếp nhận, tài liệu ở trạng thái Bản nháp. Mở chi tiết để rà soát metadata và trình phê duyệt.','blue','workflow')}`;}
return pageHead('Tiếp nhận tài liệu','Đưa tài liệu điện tử và tài liệu giấy vào một quy trình quản lý thống nhất.',R('Về kho tài liệu','repository','arrowLeft'))+`<div class="stepper">${['Chọn nguồn & tệp','Phân loại & OCR','Lưu trữ & quyền','Xác nhận'].map((t,i)=>`${i?'<span class="step-line"></span>':''}<span class="step ${im.step===i+1?'active':im.step>i+1?'done':''}"><span class="step-circle">${im.step>i+1?I('check','sm'):i+1}</span>${t}</span>`).join('')}</div><section class="card wizard-card"><div class="wizard-body">${content}</div><div class="wizard-foot">${im.step>1?B('Quay lại','intake-back','arrowLeft'):B('Hủy tiếp nhận','cancel-import','','ghost')}<span class="small soft">Bước ${im.step} / 4 · Dữ liệu mô phỏng</span>${B(im.step===4?'Hoàn tất tiếp nhận':'Tiếp tục','intake-next',im.step===4?'check':'arrow','primary')}</div></section>`;}
function renderTemplates(){const list=DB.templates.filter(t=>!UI.templateType||t.type===UI.templateType);return pageHead('Thư viện mẫu tài liệu','Bắt đầu đúng chuẩn với biểu mẫu và quy tắc mã hóa dùng chung.',B('Thêm mẫu tài liệu','new-template','plus','primary'))+`<div class="between wrap mb24"><div class="filters" style="margin:0">${select('template-type',[['','Tất cả loại tài liệu'],...TYPES],UI.templateType,'data-change="templateType" aria-label="Lọc loại mẫu"')}<span class="small muted">${list.length} mẫu có sẵn</span></div>${R('Cấu hình mã tài liệu','admin/taxonomy','settings','link')}</div><div class="grid3">${list.map(t=>`<article class="card"><button class="template-cover ${t.color} w100" data-action="template-preview" data-id="${t.id}" aria-label="Xem mẫu ${E(t.name)}"><div class="template-paper"><div class="mini-brand">AN PHÁT</div><h4>${E(t.name.toUpperCase())}</h4>${Array.from({length:9},()=>'<div class="mini-line"></div>').join('')}</div></button><div class="template-body"><div class="between"><h3>${E(t.name)}</h3>${badge(t.ext.toUpperCase())}</div><p>${E(t.dept)} · ${E(t.type)}</p><div class="flex mb16"><span class="tag mono">${E(t.code)}</span></div><div class="between">${B('Xem mẫu','template-preview','eye','link',`data-id="${t.id}"`)}${B('Dùng mẫu','use-template','plus','',`data-id="${t.id}"`)}</div></div></article>`).join('')}</div><div class="banner mt24"><span class="banner-orb">${I('office')}</span><div class="grow"><h3>Mẫu thống nhất. Nội dung linh hoạt.</h3><p>Mỗi mẫu gắn sẵn loại tài liệu, phòng ban và cấu trúc mã. Mở trình soạn thảo hoặc xem luồng tích hợp Office.</p></div>${R('Xem tích hợp Office','integrations','arrow','')}</div>`;}
function normalize(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function searchFiltered(){return DB.docs.filter(d=>{if(d.status==='Destroyed')return false;const text=UI.searchMode==='name'?d.name+' '+d.code:UI.searchMode==='content'?d.body:UI.searchMode==='metadata'?d.type+' '+d.dept+' '+d.tags.join(' '):d.name+' '+d.code+' '+d.body+' '+d.type+' '+d.dept+' '+d.tags.join(' ');return (!UI.search||normalize(text).includes(normalize(UI.search)))&&(!UI.searchDept||d.dept===UI.searchDept)&&(!UI.searchStatus||d.status===UI.searchStatus)&&(!UI.searchType||d.type===UI.searchType)&&(!UI.searchOCR||d.ocr)&&(!UI.searchDate||d.date>=UI.searchDate);});}
function highlight(text,q){let out=E(text);if(!q)return out;let escaped=E(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return out.replace(new RegExp(escaped,'ig'),m=>`<mark>${m}</mark>`);}catch(_){return out;}}
function renderSearch(){const list=searchFiltered();return pageHead('Tìm đúng tài liệu bạn cần','Tra cứu tên, nội dung mẫu, thuộc tính và văn bản OCR minh họa.',B('Tìm kiếm nâng cao','advanced-search','sliders'))+`<div class="input-icon mb24" style="min-height:48px;font-size:15px;padding:0 16px">${I('search')}<input id="search-query" value="${E(UI.search)}" data-input="search" placeholder="Ví dụ: bảo mật, hợp đồng, QT-HC-001..." aria-label="Từ khóa tìm kiếm" style="font-size:13px;padding:13px 0">${UI.search?IB('x','Xóa từ khóa','clear-search'):''}<span class="kbd">${list.length} kết quả</span></div><div class="repo-layout"><aside class="card search-facets"><h3 class="mb24">Lọc kết quả</h3><div class="stack">${F('Tìm trong',select('search-mode',[['all','Tất cả nội dung'],['name','Tên / mã tài liệu'],['content','Nội dung toàn văn'],['metadata','Metadata / thuộc tính']],UI.searchMode,'data-change="searchMode"'))}${F('Loại tài liệu',select('search-type',[['','Tất cả'],...TYPES],UI.searchType,'data-change="searchType"'))}${F('Phòng ban',select('search-dept',[['','Tất cả'],...DEPTS],UI.searchDept,'data-change="searchDept"'))}${F('Trạng thái',select('search-status',[['','Tất cả'],...Object.entries(STATUS).map(([k,v])=>[k,v[0]])],UI.searchStatus,'data-change="searchStatus"'))}<label class="check-label"><input type="checkbox" id="search-ocr" data-change="searchOCR" ${UI.searchOCR?'checked':''}>Tài liệu đã OCR</label>${UI.searchDate?`<span class="tag">Từ ${dateFmt(UI.searchDate)}</span>`:''}${B('Đặt lại bộ lọc','clear-search-filters','refresh','link')}</div></aside><section><div class="between mb16"><p class="small muted"><strong class="green">${list.length}</strong> tài liệu ${UI.search?'cho “'+E(UI.search)+'”':'trong kho mẫu'}</p><span class="small soft">Tìm cục bộ · Không có công cụ OCR thật</span></div><div class="card">${list.length?list.map(d=>`<article class="search-result"><div class="flex gap16">${fileIcon(d.ext)}<div class="grow"><h3><button data-route="document/${d.id}/overview" style="text-align:left">${highlight(d.name,UI.search)}</button></h3><div class="small soft mt8">${E(d.code)} · ${E(d.dept)} / ${E(d.type)} · v${d.version}</div></div>${statusBadge(d.status)}</div><p>${highlight(d.body.slice(0,220).replace(/\n/g,' ')+(d.body.length>220?'…':''),UI.search)}</p><div class="between wrap"><div class="flex wrap">${tags(d.tags)}${d.ocr?badge('Văn bản OCR mẫu','blue'):''}</div><span class="small soft">Cập nhật ${dateFmt(d.date)}</span></div></article>`).join(''):empty('Không tìm thấy tài liệu','Thử từ khóa ngắn hơn hoặc xóa một số bộ lọc.',B('Xóa bộ lọc','clear-search-filters','refresh'),'search')}</div></section></div>`;}
function renderApprovals(tab){const pending=DB.docs.filter(d=>d.status==='Review');const done=DB.docs.filter(d=>['Approved','Published'].includes(d.status));if(tab==='templates')return pageHead('Phê duyệt tài liệu','Thiết lập và theo dõi quy trình rà soát trước khi ban hành.',B('Tạo quy trình','workflow-template','plus','primary'))+tabbar([['inbox','Hộp phê duyệt',pending.length],['templates','Mẫu quy trình'],['history','Đã xử lý']],tab,'approvals')+`<div class="grid3">${[['Quy trình nội bộ · 2 cấp','Tuần tự','Rà soát nội dung → Duyệt ban hành'],['Hợp đồng · Pháp chế & Tài chính','Song song','Hai phòng ban phê duyệt đồng thời'],['Phê duyệt nhanh · 1 cấp','Tuần tự','Người phụ trách duyệt trực tiếp']].concat((DB.workflowTemplates||[]).map(w=>[w.name,w.mode==='parallel'?'Song song':'Tuần tự',w.people.join(' → ')])).map(([t,m,desc],i)=>`<article class="card padded"><div class="between"><span class="pill-icon">${I('workflow')}</span>${badge(m,'blue')}</div><h3 class="mt16">${t}</h3><p class="small muted mt8">${desc}</p><div class="mt24 flex">${B('Thiết kế luồng','workflow-template','sliders','',`data-template-index="${i}"`)}</div></article>`).join('')}</div>`;
let id=UI.approvalId;let d=docById(id);if(!d||d.status!=='Review'){d=pending[0];if(d)UI.approvalId=d.id;}const head=pageHead('Phê duyệt tài liệu','Rà soát nội dung, trao đổi ý kiến và đưa tài liệu sang bước tiếp theo.',B('Thiết kế quy trình','workflow-template','workflow'))+tabbar([['inbox','Hộp phê duyệt',pending.length],['templates','Mẫu quy trình'],['history','Đã xử lý',done.length]],tab,'approvals');if(tab==='history')return head+`<div class="card">${documentTable(done)}</div>`;if(!d)return head+`<div class="card">${empty('Không còn tài liệu chờ duyệt','Các tài liệu đã duyệt đang sẵn sàng tại màn hình Phát hành.',R('Đến màn hình phát hành','publishing','send','primary'),'checkCircle')}</div>`;return head+`<div class="approval-layout"><aside class="card approval-queue"><div class="card-head"><h3>Hàng đợi của bạn</h3>${badge(pending.length,'amber')}</div>${pending.map(x=>`<button class="approval-list-item ${x.id===d.id?'active':''}" data-action="select-approval" data-id="${x.id}"><div class="between"><span class="mono soft">${E(x.code)}</span>${badge(x.workflowMode==='parallel'?'Song song':'Tuần tự',x.workflowMode==='parallel'?'blue':'')}</div><h3>${E(x.name)}</h3><div class="between"><p>${E(x.owner)} · v${x.version}</p><span class="small amber">02/10</span></div></button>`).join('')}</aside><section class="card"><div class="card-head"><div><div class="flex mb8">${statusBadge(d.status)}<span class="small soft">${E(d.code)}</span></div><h2>${E(d.name)}</h2></div>${R('Xem tài liệu',`document/${d.id}/overview`,'external','')}</div><div style="padding:0 22px 22px"><div class="grid2"><div><div class="small muted mb16">TIẾN ĐỘ PHÊ DUYỆT</div>${workflowVisual(d)}</div><div class="stack"><div class="card padded" style="background:#fafcfb"><h3 class="mb16">Thông tin trình duyệt</h3>${infoRow('Người trình',E(d.owner))}${infoRow('Phiên bản','v'+E(d.version))}${infoRow('Hạn xử lý',dateFmt(d.approvalDue||'2026-10-02'))}${infoRow('Số cấp / người duyệt',(d.approvers||['a','b']).length)}${infoRow('Kiểu duyệt',d.workflowMode==='parallel'?'Song song':'Tuần tự')}</div>${F('Ý kiến của bạn',`<textarea id="approval-note" placeholder="Nhập nhận xét. Bắt buộc khi yêu cầu sửa hoặc từ chối...">${E(d.reviewNote||'')}</textarea>`)}${notice(d.workflowMode==='parallel'?'Mỗi lần “Phê duyệt” mô phỏng một người duyệt. Tài liệu chỉ hoàn tất khi đủ tất cả nhánh.':'Mỗi lần “Phê duyệt” hoàn thành một cấp hiện tại. Cấp tiếp theo được mở sau đó.','blue')}</div></div></div><div class="approval-actions"><span class="grow"></span>${B('Từ chối','approval-reject','x','',`data-id="${d.id}"`)}${B('Yêu cầu chỉnh sửa','approval-return','pencil','',`data-id="${d.id}"`)}${B('Phê duyệt bước hiện tại','approval-approve','check','primary',`data-id="${d.id}"`)}</div></section></div>`;}
function readerTable(d){const people=['Nguyễn Minh (bạn)','Trần Mai Anh','Lê Hoàng Nam','Phạm Thu Hà','Vũ Phương Linh','Đỗ Quốc Huy','Hoàng Thu Trang','Trần Gia Bảo'].slice(0,d.totalReaders||8);const selfRead=!!d.acknowledged||d.read>=d.totalReaders;const readAt=i=>i===0?selfRead:(i-1)<Math.max(0,(d.read||0)-(selfRead?1:0));return `<div class="between mb16"><div class="flex"><span class="green strong">${d.read||0} / ${d.totalReaders||8}</span><span class="small muted">người xác nhận đã đọc</span></div><span class="small soft">Phiên bản ${d.publishedVersion||d.version}</span></div><div class="progress mb24"><span style="width:${(d.read||0)/(d.totalReaders||8)*100}%"></span></div><div class="table-wrap"><table><thead><tr><th>Người nhận</th><th>Kênh phân phối</th><th>Xác nhận đọc</th></tr></thead><tbody>${people.map((p,i)=>`<tr><td><div class="flex">${avatar(initials(p.replace(' (bạn)','')),'teal')}<span>${E(p)}</span></div></td><td>Ứng dụng + email mẫu</td><td>${badge(readAt(i)?'Đã xác nhận':'Chưa đọc',readAt(i)?'green':'amber')}</td></tr>`).join('')}</tbody></table></div>`;}
function renderPublishing(tab){let list=DB.docs.filter(d=>tab==='ready'?d.status==='Approved':tab==='active'?d.status==='Published':['Obsolete','Expired'].includes(d.status));return pageHead('Phát hành & phân phối','Đưa tài liệu đã được phê duyệt đến đúng người, đúng phiên bản.',R('Hộp phê duyệt','approvals','checkCircle'))+`<div class="banner mb24"><span class="banner-orb">${I('shield')}</span><div class="grow"><h3>Mỗi lần phát hành là một phiên bản được kiểm soát.</h3><p>Quy định đối tượng nhận, thời gian hiệu lực và yêu cầu xác nhận đã đọc. Bản thu hồi vẫn được lưu trong lịch sử.</p></div></div>`+tabbar([['ready','Chờ phát hành',DB.docs.filter(d=>d.status==='Approved').length],['active','Đang có hiệu lực',DB.docs.filter(d=>d.status==='Published').length],['recalled','Thu hồi / Hết hiệu lực']],tab,'publishing')+`<section class="card">${list.length?`<div class="table-wrap"><table><thead><tr><th>Tài liệu</th><th>Phiên bản</th><th>Trạng thái</th><th>${tab==='ready'?'Người sở hữu':'Ngày hết hiệu lực'}</th><th>${tab==='active'?'Xác nhận đọc':'Bước tiếp theo'}</th><th></th></tr></thead><tbody>${list.map(d=>`<tr><td><div class="flex">${fileIcon(d.ext)}<div><button class="doc-name" data-route="document/${d.id}/overview">${E(d.name)}</button><span class="doc-sub">${E(d.code)}</span></div></div></td><td>v${d.version}</td><td>${statusBadge(d.status)}</td><td>${tab==='ready'?E(d.owner):dateFmt(d.expires)}</td><td>${tab==='active'?`<button class="flex" data-action="readers" data-id="${d.id}" style="color:#709783"><span>${d.read}/${d.totalReaders}</span><span class="progress" style="width:55px"><span style="width:${d.read/d.totalReaders*100}%"></span></span></button>`:tab==='ready'?'<span class="small muted">Phân phối nội bộ</span>':R('Xem vòng đời','lifecycle','arrow','link')}</td><td>${tab==='ready'?B('Phát hành','publish','send','primary sm',`data-id="${d.id}"`):tab==='active'?B('Thu hồi','recall','archive','sm',`data-id="${d.id}"`):R('Chi tiết',`document/${d.id}/overview`,' function renderRecords(){return pageHead('Hồ sơ công việc','Tập hợp các tài liệu liên quan theo dự án, khách hàng hoặc nghiệp vụ.',B('Tạo hồ sơ','new-record','plus','primary'))+`<div class="filters"><span class="tag">${DB.records.length} hồ sơ</span><span class="tag">${DB.records.filter(r=>!r.closed).length} đang mở</span><span class="tag">${DB.records.filter(r=>r.closed).length} đã đóng</span><span class="grow"></span><span class="small muted">Bấm vào hồ sơ để xem tài liệu và trạng thái lưu giữ.</span></div><div class="grid3">${DB.records.map((r,i)=>`<article class="card record-card"><div class="between"><span class="pill-icon ${['','blue','purple','amber'][i%4]}">${I('briefcase')}</span>${badge(r.closed?'Đã đóng / khóa':'Đang mở',r.closed?'':'green')}</div><h3><button style="text-align:left;padding:0" data-action="record-detail" data-id="${r.id}">${E(r.name)}</button></h3><p>${E(r.desc)}</p><div class="flex mt16"><span class="tag mono">${E(r.code)}</span></div><div class="record-meta"><div class="between mb12"><span class="small muted">${r.docs.length} tài liệu · ${E(r.type)}</span>${avatar(initials(r.owner),'teal')}</div><div class="between"><span class="small soft">Lưu giữ ${r.retention} năm</span>${B('Mở hồ sơ','record-detail','arrow','link',`data-id="${r.id}"`)}</div></div></article>`).join('')}</div>`;}
function renderLifecycle(tab){const active=DB.docs.filter(d=>['Expired','Obsolete'].includes(d.status)||(d.status==='Published'&&d.expires&&d.expires<='2026-10-31'));const archived=DB.docs.filter(d=>d.status==='Archived');const destruction=DB.docs.filter(d=>['DestructionPending','Destroyed'].includes(d.status));const head=pageHead('Vòng đời tài liệu','Lưu giữ có chính sách. Rà soát có kiểm soát. Hủy có phê duyệt.',B('Thêm chính sách','new-policy','plus','primary'))+`<div class="grid3 mb24">${metric('Cần rà soát',active.length,'Hết hoặc sắp hết hiệu lực','clock','lifecycle','amber')}${metric('Tài liệu lưu trữ',archived.length,'Giữ nguyên lịch sử và nội dung','archive','lifecycle/archive','purple')}${metric('Đề xuất hủy',destruction.filter(d=>d.status==='DestructionPending').length,'Chờ người có thẩm quyền duyệt','trash','lifecycle/destruction','green')}</div>`+tabbar([['review','Rà soát hiệu lực',active.length],['policies','Chính sách lưu giữ'],['archive','Kho lưu trữ',archived.length],['destruction','Xử lý hủy',destruction.length]],tab,'lifecycle');if(tab==='policies')return head+`<div class="mb16">${notice('Các thời hạn 3, 5, 10 năm dưới đây chỉ là cấu hình minh họa, không phải hướng dẫn pháp lý hay chính sách lưu giữ bắt buộc.','amber')}</div><div class="card"><div class="table-wrap"><table><thead><tr><th>Chính sách</th><th>Mốc tính thời hạn</th><th>Thời hạn</th><th>Khi kết thúc</th><th></th></tr></thead><tbody>${DB.policies.map(p=>`<tr><td><strong style="color:#5f7367">${E(p.name)}</strong><div class="small soft">Loại: ${E(p.type)}</div></td><td>${E(p.trigger)}</td><td>${p.years} năm</td><td>${E(p.action)}</td><td>${B('Chỉnh sửa','edit-policy','pencil','sm',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div></div>`;let list=tab==='archive'?archived:tab==='destruction'?destruction:active;return head+`<div class="card">${list.length?`<div class="table-wrap"><table><thead><tr><th>Tài liệu</th><th>Trạng thái</th><th>Hết hiệu lực</th><th>Lưu giữ</th><th> function renderShared(){const links=DB.links;return pageHead('Chia sẻ có kiểm soát','Quản lý các liên kết được cấp quyền, thời hạn và phạm vi sử dụng.',B('Chia sẻ tài liệu','share-picker','plus','primary'))+`<div class="grid3 mb24">${metric('Liên kết đang hoạt động',links.filter(l=>l.active&&l.expiry>=TODAY).length,'Đều là liên kết minh họa, không truy cập thật','link','shared','green')}${metric('Giới hạn chỉ xem',links.filter(l=>!l.download&&l.active).length,'Tắt tải xuống trong cấu hình giao diện','eye','shared','purple')}${metric('Sắp hết thời hạn',links.filter(l=>l.active&&l.expiry<='2026-10-15').length,'Trong 15 ngày của kịch bản mẫu','clock','shared','amber')}</div><div class="card"><div class="card-head"><h2>Liên kết chia sẻ</h2><span class="small soft">Không gian An Phát</span></div><div class="table-wrap"><table><thead><tr><th>Tài liệu & đối tượng</th><th>Quyền</th><th>Hết hạn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${links.map(l=>{const d=docById(l.doc);if(!d)return'';return `<tr><td><div class="flex">${fileIcon(d.ext)}<div><button class="doc-name" data-route="document/${d.id}/overview">${E(d.name)}</button><span class="doc-sub">${E(l.name)}</span></div></div></td><td><span class="tag">${l.download?'Cho tải xuống':'Chỉ xem'}</span></td><td>${dateFmt(l.expiry)}</td><td>${badge(!l.active?'Đã thu hồi':l.expiry<TODAY?'Hết hạn':'Đang mở',!l.active?'':l.expiry<TODAY?'red':'green')}</td><td><div class="flex">${IB('eye','Xem thử người nhận','guest-preview',`data-id="${l.id}"`)}${IB('copy','Sao chép liên kết mẫu','copy-link',`data-id="${l.id}"`)}${l.active?IB('x','Thu hồi liên kết','revoke-link',`data-id="${l.id}"`):''}</div></td></tr>`;}).join('')}</tbody></table></div>${!links.length?empty('Chưa có liên kết','Tạo chia sẻ từ một tài liệu để xem luồng cấp quyền.'):''}</div><div class="mt24">${notice('Liên kết sử dụng miền .example dành cho minh họa. Nút “Xem thử người nhận” mở bản xem trước trong demo; không công khai tài liệu lên Internet.','bl function reportDocs(){return DB.docs.filter(d=>d.status!=='Destroyed'&&(UI.reportRange==='Toàn bộ dữ liệu'||d.date.startsWith(UI.reportRange==='Tháng 10/2026'?'2026-10':'2026-09')));}
function renderReports(tab){const docs=reportDocs();const size=docs.reduce((n,d)=>n+d.size,0);const head=pageHead('Báo cáo quản trị','Theo dõi tài liệu, mức sử dụng lưu trữ và hoạt động trong không gian.',select('report-range',['Toàn bộ dữ liệu','Tháng 10/2026','Tháng 09/2026'],UI.reportRange,'data-change="reportRange" style="min-width:160px;font-size:11px"')+B('Xuất CSV mẫu','export-report','download','primary'))+tabbar([['overview','Tổng quan'],['storage','Dung lượng'],['activity','Hoạt động người dùng'],['expiry','Hết hạn & lưu giữ']],tab,'reports');if(tab==='expiry')return head+`<div class="card"><div class="card-head"><h2>Tài liệu hết hoặc sắp hết hiệu lực</h2><span class="small soft">Trong kỳ dữ liệu đã chọn · Đến 31/10/2026</span></div>${documentTable(docs.filter(d=>d.expires&&d.expires<='2026-10-31'))}</div><div class="mt24">${R('Xử lý vòng đời tài liệu','lifecycle','arrow','primary')}</div>`;if(tab==='activity')return head+`<div class="card"><div class="card-head"><h2>Hoạt động theo người dùng</h2><span class="small soft">Các sự kiện có trong nhật ký mẫu</span></div><div class="table-wrap"><table><thead><tr><th>Người dùng</th><th>Phòng ban</th><th>Xem</th><th>Sửa</th><th>Tải xuống</th><th>Tổng hành động</th></tr></thead><tbody>${DB.users.map(u=>`<tr><td><div class="flex">${avatar(u.initials,'teal')}<strong>${E(u.name)}</strong></div></td><td>${E(u.dept)}</td>${['Xem tài liệu','Sửa tài liệu','Tải xuống'].map(a=>`<td>${DB.audit.filter(x=>x.user===u.name&&x.action===a).length}</td>`).join('')}<td>${DB.audit.filter(x=>x.user===u.name).length}</td></tr>`).join('')}</tbody></table></div></div><div class="mt16">${notice('Báo cáo hoạt động dùng toàn bộ nhật ký demo; bộ chọn kỳ ở trên áp dụng cho các báo cáo tài liệu.','gray')}</div>`;if(tab==='storage')return head+`<div class="grid2"><section class="card padded"><h2>Dung lượng tài liệu trong kỳ</h2><div class="metric-value">${size.toFixed(1)} <span class="muted" style="font-size:16px">MB / ${DB.quota} MB</span></div><div class="progress thick"><span style="width:${Math.min(100,size/DB.quota*100)}%"></span></div><p class="small muted mt12">Dung lượng mô phỏng dựa trên các tệp mẫu, không phải dung lượng máy tính của bạn.</p><div class="mt24">${R('Hạn mức & sao lưu','admin/storage','settings','')}</div></section><section class="card padded"><h2 class="mb16">Theo định dạng</h2>${['pdf','docx','xlsx','pptx'].map(ext=>{let n=docs.filter(d=>d.ext===ext).reduce((n,d)=>n+d.size,0);return `<div class="list-row"><span class="grow">${fileIcon(ext)}</span><span class="small muted">${docs.filter(d=>d.ext===ext).length} tài liệu</span><strong>${n.toFixed(1)} MB</strong></div>`;}).join('')}</section></div>`;return head+`<div class="grid4 mb24">${metric('Tài liệu trong kỳ',docs.length,'Theo ngày cập nhật tài liệu','files','repository','green')}${metric('Tài liệu đã phát hành',docs.filter(d=>d.status==='Published').length,'Bản chính thức đang có hiệu lực','send','publishing/active','green')}${metric('Dung lượng trong kỳ',size.toFixed(1)+' MB','Dung lượng mô phỏng từ tệp mẫu','database','reports/storage','purple')}${metric('Người dùng mẫu',DB.users.length,'Toàn bộ không gian làm việc','users','admin/users','amber')}</div><div class="grid2"><section class="card padded"><div class="between mb24"><h2>Tài liệu theo phòng ban</h2>${badge(UI.reportRange)}</div><div class="report-bars">${DEPTS.map(dept=>{const count=docs.filter(d=>d.dept===dept).length;const max=Math.max(1,...DEPTS.map(x=>docs.filter(d=>d.dept===x).length));return `<div class="bar-group"><div class="bar" title="${E(dept)}: ${count} tài liệu" style="height:${count/max*90}%;width:30px;position:relative"><span style="position:absolute;top:-22px;width:100%;text-align:center;font-size:10px;color:#7c9787">${count}</span></div><small>${E(dept)}</small></div>`;}).join('')}</div><div style="height:30px"></div></section><section class="card padded"><h2 class="mb24">Trạng thái xử lý</h2>${['Draft','Review','Approved','Published','Archived'].map(s=>{const count=docs.filter(d=>d.status===s).length;return `<div class="mb16"><div class="between mb8"><span class="small muted">${STATUS[s][0]}</span><strong class="small">${count}</strong></div><div class="progress"><span style="width:${count/Math.max(docs.length,1)*100}%"></span></div></div>`;}).join('')}</section></div><div class="mt24">${notice('Báo cáo phản ánh dữ liệu mẫu trong trình duyệt. Thao tác tiếp nhận, duyệt và phát hành sẽ cập nhật các số đếm liên quan.','gray','chart')}</div>`;}
function auditTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td class="mono">${E(a.time)}</td><td>${E(a.user)}</td><td><span class="event-action">${E(a.action)}</span></td><td><span class="doc-name">${E(a.doc)}</span><span class="doc-sub">${E(a.code)}</span></td><td>${IB('external','Chi tiết sự kiện','audit-detail',`data-id="${E(a.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Chưa có hoạt động phù hợp','Thay đổi bộ lọc hoặc thao tác với tài liệu để có nhật ký mẫu.','','history');}
function renderAudit(){const list=DB.audit.filter(a=>(!UI.auditAction||a.action===UI.auditAction)&&(!UI.auditSearch||normalize(a.user+' '+a.doc+' '+a.code).includes(normalize(UI.auditSearch))));return pageHead('Nhật ký truy vết','Theo dõi ai đã làm gì, trên tài liệu nào và vào thời điểm nào.',B('Xuất nhật ký mẫu','export-audit','download','primary'))+`<div class="filters"><div class="input-icon search-inline">${I('search','sm')}<input id="audit-search" data-input="auditSearch" value="${E(UI.auditSearch)}" placeholder="Người dùng, tài liệu, mã..." aria-label="Tìm nhật ký"></div>${select('audit-action',[['','Tất cả hành động'],...Array.from(new Set(DB.audit.map(a=>a.action)))],UI.auditAction,'data-change="auditAction"')}<span class="grow"></span><span class="small soft">${list.length} sự kiện · Dữ liệu mẫu</span></div><div class="card">${auditTable(list)}</div><div class="mt24">${notice('Các thao tác trong demo được ghi vào nhật ký cục bộ. Đây không phải audit log bất biến hoặc nguồn chứng cứ của hệ thống thật.','gray','shield')}</div>`;}

 {id:'email',name:'Email & Outlook',icon:'mail',color:'mail',desc:'Nhập tệp đính kèm từ hộp thư và thiết lập kênh thông báo.',group:'Tiếp nhận'},
 {id:'erp',name:'Hệ thống ERP',icon:'briefcase',color:'erp',desc:'Gắn tài liệu với hóa đơn, hợp đồng và quy trình nghiệp vụ.',group:'Nghiệp vụ'},

function renderIntegrations(tab){const head=pageHead('Kết nối không gian làm việc','Thiết lập các điểm tích hợp trong hệ sinh thái tài liệu doanh nghiệp.',B('Xem nhật ký kết nối','integration-log','history'))+tabbar([['connectors','Các kết nối'],['api','REST API'],['webhooks','Webhook']],tab,'integrations');if(tab==='api')return head+`<div class="grid2"><section class="card padded"><div class="between mb24"><h2>Cấu hình API</h2>${badge('Sandbox · Giả lập','blue')}</div><div class="stack">${F('Base URL minh họa',input('api-base','https://demo.folio.example/api/v1','readonly'))}${F('API key mẫu',input('api-key','DEMO_KEY_NOT_A_REAL_SECRET','readonly'), 'Chuỗi minh họa, không cấp quyền cho hệ thống nào.')}${F('Phạm vi cấp quyền',select('api-scope',['documents:read, documents:write','documents:read','metadata:read, audit:read']))}<div class="flex">${B('Đổi khóa mẫu','rotate-key','key')}${B('Lưu cấu hình mẫu','save-generic','save','primary',`data-label="Cấu hình API"`)}</div></div><div class="mt24">${notice('Không gửi HTTP request. Không tạo khóa API thật. Tất cả đầu ra bên phải đều được dựng trong trình duyệt.','amber','api')}</div></section><section class="card padded"><h2 class="mb16">Thử một request</h2><div class="flex mb16">${select('api-method',['GET','POST'],'GET','style="width:90px"')}${input('api-path','/documents?status=Published')}</div><div class="code-block" id="api-result">// Nhấn “Chạy giả lập” để xem cấu trúc phản hồi.\n// Không có yêu cầu được gửi ra mạng.</div><div class="mt16">${B('Chạy giả lập','test-api','play','primary')}</div></section></div>`;
if(tab==='webhooks')return head+`<section class="card padded" style="max-width:860px"><div class="between mb24"><h2>Đăng ký sự kiện tài liệu</h2>${badge('Cấu hình minh họa')}</div><div class="grid2">${F('Tên webhook',input('webhook-name',DB.webhook?.name||'Thông báo cho hệ thống nghiệp vụ'))}${F('Endpoint',input('webhook-url',DB.webhook?.url||'https://internal.example/webhooks/dms','type="url"'))}</div><div class="divider"></div><h3 class="mb16">Sự kiện cần nhận</h3><div class="grid2">${['document.created','document.version.updated','document.approved','document.published','document.expired','document.deleted'].map((x,i)=>`<label class="check-label"><input type="checkbox" name="webhook-event" value="${x}" ${i<4?'checked':''}><span class="mono">${x}</span></label>`).join('')}</div><div class="mt24 flex">${B('Gửi thử mẫu','test-webhook','send')}${B('Lưu webhook mẫu','save-webhook','save','primary')}</div><div class="mt24">${notice('Nút gửi thử chỉ hiển thị payload mẫu; không gửi dữ liệu tới endpoint.','gray')}</div></section>`;return head+`<div class="grid3">${CONNECTORS.map(c=>`<article class="card integration-card"><div class="between"><span class="integration-logo ${c.color}">${I(c.icon,'lg')}</span>${badge(DB.integrations[c.id]?'Đã cấu hình mẫu':'Chưa cấu hình',DB.integrations[c.id]?'green':'')}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="integration-foot"><span class="small soft">${c.group}</span>${B('Cấu hình','configure-integration','settings','sm',`data-id="${c.id}"`)}</div></article>`).join('')}</div><div class="mt24">${notice('Tất cả kết nối, trạng thái đồng bộ, chữ ký và kiểm thử tích hợp ở đây là mô phỏng. Không có tài khoản hay hệ thống bên ngoài nào được kết nối.','gray','plug')}</div>`;}
const SETTINGS_TABS=[['users','Người dùng','user'],['groups','Nhóm & phòng ban','users'],['roles','Vai trò & quyền','shield'],['taxonomy','Danh mục tài liệu','folder'],['metadata','Metadata / Schema','tag'],['security','Bảo mật & xác thực','lock'],['storage','Dung lượng & sao lưu','database']];
function renderAdmin(tab){let body='';const head=pageHead('Cấu hình hệ thống','Quản lý không gian làm việc, chuẩn tài liệu và các chính sách dùng chung.',badge('Quản trị viên · Chế độ demo','green'));if(tab==='users')body=`<section class="card"><div class="card-head"><div><h2>Người dùng</h2><p>${DB.users.length} tài khoản mẫu trong không gian An Phát.</p></div>${B('Thêm người dùng','new-user','plus','primary')}</div><div class="table-wrap"><table><thead><tr><th>Người dùng</th><th>Phòng ban</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>${DB.users.map(u=>`<tr><td><div class="flex">${avatar(u.initials,'teal')}<div><strong style="color:#5e6f63">${E(u.name)}</strong><div class="small soft">${E(u.email)}</div></div></div></td><td>${E(u.dept)}</td><td>${E(u.role)}</td><td>${badge(u.status,u.status==='Hoạt động'?'green':'amber')}</td><td>${IB('pencil','Chỉnh sửa người dùng','edit-user',`data-id="${u.id}"`)}</td></tr>`).join('')}</tbody></table></div><div class="card-foot"><span>Tài khoản giả lập · Email dùng miền .example</span>${B('Đồng bộ AD / LDAP','configure-integration','refresh','link','data-id="ldap"')}</div></section>`;
else if(tab==='groups')body=`<section class="card"><div class="card-head"><div><h2>Nhóm & phòng ban</h2><p>Cấp quyền tập trung thay vì cấu hình từng người dùng.</p></div>${B('Tạo nhóm','new-group','plus','primary')}</div><div class="table-wrap"><table><thead><tr><th>Tên nhóm</th><th>Thành viên</th><th>Phạm vi tài liệu</th><th></th></tr></thead><tbody>${DB.groups.map((g,i)=>`<tr><td><div class="flex">${I('users')}<strong>${E(g.name)}</strong></div></td><td>${g.members} người</td><td>${E(g.scope)}</td><td>${B('Quản lý nhóm','edit-group','pencil','sm',`data-index="${i}"`)}</td></tr>`).join('')}</tbody></table></div></section><div class="mt24">${R('Quản lý danh mục phòng ban','admin/taxonomy','folder','link')}</div>`;
else if(tab==='roles'){const selected=UI.adminRole||'Biên tập viên';const keys=['Xem','Sửa','Xóa','Tải xuống','Chia sẻ','In','Phê duyệt','Phát hành','Quản trị'];body=`<section class="card padded"><div class="between mb24"><div><h2>Ma trận quyền theo vai trò</h2><p class="small muted mt8">Khai báo quyền thao tác và phạm vi áp dụng.</p></div>${B('Lưu quyền mẫu','save-role','save','primary')}</div><div class="grid2 mb24">${F('Vai trò',select('admin-role',['Quản trị viên','Biên tập viên','Người phê duyệt','Người xem'],selected,'data-change="adminRole"'))}${F('Phạm vi',select('role-scope',['Toàn không gian','Theo thư mục / phòng ban','Theo từng tài liệu'],DB.roleScope?.[selected]||'Toàn không gian'))}</div><div class="table-wrap"><table><thead><tr><th>Quyền thao tác</th><th>Cho phép</th><th>Ý nghĩa</th></tr></thead><tbody>${keys.map((k,i)=>`<tr><td><strong>${k}</strong></td><td><input type="checkbox" name="role-permission" value="${i}" aria-label="Quyền ${k}" ${(DB.roleMatrix?.[selected]?.[i]??(selected==='Quản trị viên'||selected==='Người xem'?[0,3,5].includes(i)||selected==='Quản trị viên':selected==='Người phê duyệt'?[0,3,5,6].includes(i):[0,1,3,4,5].includes(i)))?'checked':''}></td><td>${['Mở bản xem trước','Chỉnh sửa và tạo phiên bản','Xóa / đưa vào thùng rác','Nhận bản tệp','Cấp liên kết hoặc chia sẻ nội bộ','In bản tài liệu','Xử lý các bước duyệt','Công bố bản chính thức','Quản lý cấu hình và người dùng'][i]}</td></tr>`).join('')}</tbody></table></div><div class="mt24">${notice('Quyền trong ma trận là cấu hình giao diện. Chuyển vai trò demo không tạo ranh giới bảo mật và không thay thế kiểm tra quyền ở máy chủ.','amber','shield')}</div></section>`;}

else if(tab==='storage'){const used=DB.docs.filter(d=>d.status!=='Destroyed').reduce((n,d)=>n+d.size,0);body=`<div class="stack24"><section class="card padded"><div class="between mb24"><h2>Dung lượng & hạn mức</h2>${B('Lưu hạn mức','save-quota','save','')}</div><div class="grid2"><div><div class="metric-value">${used.toFixed(1)} <span class="muted" style="font-size:15px">MB / ${DB.quota} MB</span></div><div class="progress thick"><span style="width:${Math.min(100,used/DB.quota*100)}%"></span></div><p class="small muted mt12">Dung lượng mô phỏng của tài liệu trong kho.</p></div><div class="stack">${F('Hạn mức kho (MB)',input('storage-quota',DB.quota,'type="number" min="50" max="100000"'))}${F('Kho lưu trữ dài hạn',select('archive-storage',['Archive Storage · Khu vực nội bộ','Object Storage · Private Cloud']))}</div></div></section><section class="card"><div class="card-head"><div><h2>Sao lưu & khôi phục</h2><p>Danh sách snapshot giả lập, không phải bản sao tệp thật.</p></div>${B('Tạo bản sao mẫu','backup','database','primary')}</div><div class="table-wrap"><table><thead><tr><th>Thời điểm</th><th>Loại sao lưu</th><th>Dung lượng mẫu</th><th>Trạng thái</th><th></th></tr></thead><tbody>${DB.backups.map(b=>`<tr><td>${E(b.date)}</td><td>${E(b.type)}</td><td>${E(b.size)}</td><td>${badge('Hoàn tất · Demo','green')}</td><td>${B('Khôi phục','restore-backup','history','sm',`data-id="${b.id}"`)}</td></tr>`).join('')}</tbody></table></div></section><section class="card padded"><h2 class="mb16">Kịch bản phục hồi sự cố (DR)</h2><div class="grid3">${F('Chu kỳ sao lưu',select('backup-period',['Hàng ngày · 02:00','Mỗi 6 giờ','Hàng tuần']))}${F('RPO mục tiêu (giờ)',input('backup-rpo',6,'type="number" min="0"'))}${F('RTO mục tiêu (giờ)',input('backup-rto',4,'type="number" min="0"'))}</div><p class="small muted mt12">RPO: khoảng dữ liệu có thể mất; RTO: thời gian mục tiêu khôi phục. Các chỉ tiêu trên chỉ dùng minh họa giao diện.</p><div class="mt16">${B('Lưu cấu hình DR mẫu','save-generic','save','',`data-label="Cấu hình DR"`)}</div></section></div>`;}

function renderFlows(){return pageHead('Khám phá Folio DMS','Đi qua các hành trình chính hoặc mở trực tiếp màn hình tương ứng với từng yêu cầu.',B('Đặt lại dữ liệu demo','reset','refresh'),'BẢN ĐỒ TÍNH NĂNG & USERFLOW')+`<div class="banner mb24"><span class="banner-orb">${I('checkCircle')}</span><div class="grow"><h3>20 / 20 nhóm nghiệp vụ có giao diện tương ứng.</h3><p>Các màn hình có thể điều hướng và nhập liệu mẫu. OCR, Office, bảo mật, gửi email, ký số và sao lưu chưa được triển khai thật.</p></div>${badge('Clickable prototype','green')}</div><div class="grid3 mb24">${DEMO_FLOWS.map((f,i)=>`<button class="card flow-card" data-action="start-flow" data-id="${f.id}"><div class="between"><span class="pill-icon ${['','blue','purple','amber',''][i]}">${I(f.icon)}</span><span class="small soft">${String(i+1).padStart(2,'0')} / 05</span></div><h3>${f.title}</h3><p>${f.desc}</p><div class="between mt24"><span class="small muted">${f.steps.length} bước hướng dẫn</span><span class="green small flex">Bắt đầu ${I('arrow','sm')}</span></div></button>`).join('')}</div><section class="card"><div class="card-head"><div><h2>Đối chiếu yêu cầu → Màn hình</h2><p>Bấm “Mở giao diện” để kiểm tra từng nhóm tính năng trong mô tả của bạn.</p></div>${badge('20 nhóm','green')}</div><div class="table-wrap"><table style="white-space:normal"><thead><tr><th style="width:50px">#</th><th style="min-width:180px">Nhóm nghiệp vụ</th><th style="min-width:260px">Tính năng được thể hiện</th><th style="min-width:200px">Vị trí giao diện</th><th></th></tr></thead><tbody>${FEATURE_MAP.map(f=>`<tr><td><span class="feature-number">${String(f.n).padStart(2,'0')}</span></td><td><strong style="color:#5b6c61">${f.name}</strong></td><td style="font-size:11px;line-height:1.8">${f.features}</td><td style="font-size:11px;line-height:1.8">${f.where}</td><td>${R('Mở giao diện',f.route,'arrow','sm')}</td></tr>`).join('')}</tbody></table></div></section><section class="card padded mt24"><h2 class="mb12">Phạm vi của bản demo</h2><p class="muted" style="font-size:12px;line-height:1.9">Demo chạy hoàn toàn trong trình duyệt bằng HTML, CSS và JavaScript, không cần máy chủ hoặc tài khoản. Một số thao tác thay đổi dữ liệu cục bộ để minh họa userflow. Không gửi file, email, mật khẩu hay dữ liệu tới dịch vụ ngoài. Có thể đặt lại bất kỳ lúc nào để quay về bộ dữ liệu ban đầu.</p><div class="divider"></div><p class="small muted">Tham khảo cách tổ chức dashboard, upload và side panel từ <a href="https://www.saasframe.io/" target="_blank" rel="noopener noreferrer">SaaSFrame</a>. Giao diện Folio là thiết kế riêng, không sử dụng tệp thiết kế trả phí hoặc sao chép màn hình sản phẩm.</p></section>`;}
function tourbar(){if(!UI.tour)return'';const f=DEMO_FLOWS.find(f=>f.id===UI.tour.id);if(!f)return'';const index=UI.tour.index;const step=f.steps[index];return `<section class="tourbar" aria-label="Hướng dẫn userflow"><span class="feature-number" style="color:#d5e4d9;background:#405b49;border-color:#58725f">${index+1}</span><div class="grow"><div class="between"><strong style="font-size:12px">${step[1]}</strong><div class="flow-mini">${f.steps.map((s,i)=>`<span class="${index===i?'active':''}"></span>`).join('')}</div><p>${step[2]}</p></div><div class="flex">${index?B('Trước','tour-prev','arrowLeft','sm'):''}${B(index===f.steps.length-1?'Hoàn tất':'Bước tiếp','tour-next',index===f.steps.length-1?'check':'arrow','primary sm')}${IB('x','Đóng hướng dẫn','tour-close')}</div></section>`;}

/* Dialog infrastructure and forms. A focus trap keeps keyboard use inside dialogs. */
function openModal(title,subtitle,body,footer='',wide=false,drawer=false){if(!$('#modal-root').contains(document.activeElement))lastFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="overlay" data-overlay><section class="modal ${wide?'wide':''} ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description"><header class="modal-head"><div><h2 id="dialog-title">${title}</h2><p id="dialog-description">${subtitle}</p></div>${IB('x','Đóng hộp thoại','modal-close')}</header><div class="modal-body">${body}</div>${footer?`<footer class="modal-foot">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';const focus=$('input:not([readonly]):not([type=checkbox]):not([type=radio]),select,textarea,button',$('.modal-body'))||$('button',$('.modal-head'));if(focus)focus.focus({preventScroll:true});}
function closeModal(){const root=$('#modal-root');if(root&&root.innerHTML){root.innerHTML='';document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}MOD={};}
